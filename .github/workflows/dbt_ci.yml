name: dbt CI

# Runs the dbt pipeline on every push and pull request.
# This is "CI/CD for analytics" — the same pattern a data engineering
# team uses to make sure a change doesn't break production before it merges.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build models and run tests
        run: dbt build --profiles-dir .
